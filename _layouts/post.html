<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="post-body">

  <div class="post-wrapper">
    <main class="post-content-area">

      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %d, %Y" }}
        </time>
      </header>

      <div class="post-body-content">
        {{ content }}
      </div>

      <div class="post-share">
        <hr class="post-share-divider">
        <div class="post-share-actions">

          <!-- Twitter / X -->
          <a class="post-share-btn"
             href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ page.url | absolute_url | uri_escape }}"
             target="_blank" rel="noopener noreferrer" aria-label="Share on Twitter">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
            </svg>
          </a>

          <!-- WhatsApp -->
          <a class="post-share-btn"
             href="https://wa.me/?text={{ page.title | uri_escape }}%20{{ page.url | absolute_url | uri_escape }}"
             target="_blank" rel="noopener noreferrer" aria-label="Share on WhatsApp">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </a>

          <!-- LinkedIn -->
          <a class="post-share-btn"
             href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | uri_escape }}"
             target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
          </a>

          <!-- Copy link -->
          <button class="post-share-btn post-copy-btn" aria-label="Copy link" onclick="copyPostLink(this)">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span class="copy-label">copy link</span>
          </button>

        </div>
      </div>

      <a href="{{ '/blog/' | relative_url }}" class="back-writings">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
          <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/>
        </svg>
        writings
      </a>

    </main>
  </div>

  <div class="home-footer-bar">
    <div class="home-footer-inner">
      <hr class="home-divider">
      <footer class="home-footer">
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }} &middot; made using <a href="https://jekyllrb.com" target="_blank" rel="noopener noreferrer">jekyll</a></p>
      </footer>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script>
    // Lightbox
    document.querySelectorAll('.post-body-content img').forEach(function(img) {
      img.addEventListener('click', function() {
        document.getElementById('lightbox-img').src = this.src;
        document.getElementById('lightbox-img').alt = this.alt;
        document.getElementById('lightbox').classList.add('active');
      });
    });

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    // Copy link
    function copyPostLink(btn) {
      navigator.clipboard.writeText(window.location.href).then(function() {
        var label = btn.querySelector('.copy-label');
        label.textContent = 'copied!';
        setTimeout(function() { label.textContent = 'copy link'; }, 2000);
      });
    }
  </script>
</body>
</html>
