<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <style>
    /* ── Home page overrides ── */
    body.home-body {
      background-color: #ffffff;
      color: #1a1a1a;
      font-family: 'Inconsolata', 'Courier New', monospace;
      line-height: 1.7;
      margin: 0;
      padding: 0;
    }

    .home-container {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* ── Profile header ── */
    .profile-header {
      margin-bottom: 40px;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 40px;
    }

    .header-text .site-title {
      font-size: 2.2rem;
      font-weight: normal;
      color: #1a1a1a;
      margin-bottom: 8px;
      letter-spacing: 0;
    }

    .header-text .site-subtitle {
      font-size: 1.1rem;
      color: #555555;
      max-width: 280px;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    /* ── Nav ── */
    .profile-header .nav-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 50px;
      border: none;
      padding: 12px 0;
      position: sticky;
      top: 16px;
      background-color: #ffffff;
      z-index: 100;
    }

    .nav-link {
      color: #1a1a1a;
      text-decoration: none;
      font-size: 1rem;
      font-family: 'Inconsolata', monospace;
      padding-bottom: 4px;
      transition: color 0.2s ease;
      border-bottom: 2px solid transparent;
    }

    .nav-link.active {
      border-bottom: 2px solid #ef4444;
    }

    /* ── Main content ── */
    .home-content p {
      font-size: 1rem;
      color: #333333;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .home-content a {
      color: #1a1a1a;
      text-decoration: underline;
    }

    .home-content a:hover {
      color: #22c55e;
    }

    .home-content h2 {
      font-size: 1.1rem;
      font-weight: normal;
      color: #555555;
      margin: 2rem 0 0.75rem;
    }

    /* ── Footer ── */
    .home-footer-dark {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #eaeaea;
    }

    .home-footer-dark p {
      font-size: 0.85rem;
      color: #aaaaaa;
    }

    .home-footer-dark a {
      color: #aaaaaa;
      text-decoration: underline;
    }

    .home-footer-dark a:hover {
      color: #22c55e;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .home-container {
        padding: 32px 20px;
      }

      .header-text .site-title {
        font-size: 1.7rem;
      }

      .profile-header .nav-bar {
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="home-body">

  <div class="home-container">
    {% include home-header.html %}

    <main class="home-content">
      {{ content }}
    </main>

    <div class="home-footer-dark">
      <p>&copy; {{ "now" | date: "%Y" }} kwabsntim &middot; made with <a href="https://jekyllrb.com" target="_blank" rel="noopener noreferrer">jekyll</a></p>
    </div>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script>
    document.querySelectorAll('.nav-link').forEach(function(link) {
      var accent = link.getAttribute('data-accent');
      link.addEventListener('mouseenter', function() {
        this.style.color = accent;
      });
      link.addEventListener('mouseleave', function() {
        this.style.color = this.classList.contains('active') ? '' : '#1a1a1a';
      });
    });
  </script>
</body>
</html>
